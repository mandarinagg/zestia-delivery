name: Bug
description: Algo no funciona como debería
title: "[Bug] "
labels: ["tipo:bug"]
body:
  - type: markdown
    attributes:
      value: "⚠️ No incluyas datos personales reales, secretos ni API keys. Las vulnerabilidades se reportan por Security Advisories, no aquí."
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado vs. obtenido
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno / versión / correlationId
