# Entorno local de desarrollo. NO usar en producción.
# Uso: cp infra/docker/.env.example infra/docker/.env && docker compose -f infra/docker/docker-compose.yml up -d
name: zestia-delivery

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zestia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zestia_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-zestia}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.34
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025' # UI web
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
