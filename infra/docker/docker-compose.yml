# Entorno local de desarrollo. NO usar en producción.
# Uso: cp infra/docker/.env.example infra/docker/.env && docker compose -f infra/docker/docker-compose.yml up -d
name: zestia-delivery

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Superusuario de bootstrap: solo para administrar el contenedor. Ni la API ni las
      # migraciones lo usan (ver postgres/initdb/01-roles.sh).
      POSTGRES_USER: ${POSTGRES_USER:-zestia_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zestia_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-zestia}
      # Claves de los roles zestia_migrator y zestia_app (creados al inicializar el volumen).
      ZESTIA_MIGRATOR_PASSWORD: ${ZESTIA_MIGRATOR_PASSWORD:-change_me_migrator_local_only}
      ZESTIA_APP_PASSWORD: ${ZESTIA_APP_PASSWORD:-change_me_app_local_only}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Se ejecuta SOLO con un volumen vacío. Si ya tenías datos: `docker compose ... down -v`.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: durante la inicialización (initdb) Postgres solo escucha en el socket local,
      # así que "healthy" implica que los roles ya fueron creados.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.34
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025' # UI web
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
